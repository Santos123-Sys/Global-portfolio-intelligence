# The name of the `verify` job below is what branch protection points at as the
# required status check. Renaming the job silently detaches the gate: protection
# keeps waiting for a check that no longer reports, or the rule stops matching
# and merges go through unchecked. tests/ci-gate.test.ts pins it for that reason.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: security
          POSTGRES_PASSWORD: security
          POSTGRES_DB: security
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://security:security@127.0.0.1:5432/security
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      MFA_ENCRYPTION_KEY: ci-only-mfa-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh Vite lock for the release repair
        run: |
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; let out; try {out=execFileSync("npm",["audit","--json"],{encoding:"utf8"});} catch(error){out=error.stdout;} const report=JSON.parse(out); console.log("GPI_VITE_AUDIT "+JSON.stringify(report.vulnerabilities?.vite??{}));'
          node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";import{execFileSync}from"node:child_process";const lock=JSON.parse(readFileSync("package-lock.json","utf8")),entry=lock.packages["node_modules/vitest/node_modules/vite"],m=JSON.parse(execFileSync("npm",["view","vite@8.2.4","--json"],{encoding:"utf8"}));if(entry.version!=="8.2.2"||m.version!=="8.2.4"||JSON.stringify(Object.entries(entry.dependencies).sort())!==JSON.stringify(Object.entries(m.dependencies).sort()))throw Error("Unexpected Vite metadata "+JSON.stringify({installed:entry.version,target:m.version,dependencies:m.dependencies}));entry.version=m.version;entry.resolved=m.dist.tarball;entry.integrity=m.dist.integrity;writeFileSync("package-lock.json",JSON.stringify(lock,null,2)+"\n");'
          npm ci
          node --input-type=module -e 'import{readFileSync}from"node:fs";const raw=readFileSync("package-lock.json"),b=raw.toString("base64"),size=8000,total=Math.ceil(b.length/size);for(let index=0;index<total;index++)console.log("GPI_LOCK_REPAIR "+JSON.stringify({index,total,bytes:raw.length,base64:b.slice(index*size,(index+1)*size)}));'
      - name: Reject production advisories and severe toolchain advisories
        run: |
          npm audit --omit=dev --audit-level=moderate
          node scripts/check-dev-audit.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:worker
      - name: Build shared Risk Studio release source
        run: RISK_BUNDLE_STDOUT=true node scripts/build-risk-function.mjs
      - run: npm test
      - name: Verify native PostgreSQL browser admission, claims and process loss
        run: BROWSER_POSTGRES_TEST_URL="$DATABASE_URL" node --import tsx scripts/verify-browser-postgres.ts
      - name: Check out the pinned FilingLens approval implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Santos123-Sys/FilingLens
          ref: 3e2e896085dd7263da5524210693cbadfa7a4a97
          path: .cross-app/filinglens
          persist-credentials: false
      - name: Install FilingLens verification dependencies
        run: npm ci --prefix .cross-app/filinglens
      - name: Verify real signed-in cross-application approval flow
        run: FILINGLENS_TEST_ROOT="$GITHUB_WORKSPACE/.cross-app/filinglens" npm test -- tests/approval-flow.integration.test.ts
      - run: npm run build
      - name: Install browser for workflow smoke test
        run: npx playwright install --with-deps chromium
      - name: Verify isolated browser execution and durable control
        run: |
          npm run browser:verify
          npm run browser:test
      - name: Verify built FilingLens authorization and recovery
        run: |
          npm run build --prefix .cross-app/filinglens
          FILINGLENS_TEST_ROOT="$GITHUB_WORKSPACE/.cross-app/filinglens" node scripts/verify-filinglens-security.mjs
      - name: Verify built financial evidence and calculation recovery
        working-directory: .cross-app/filinglens
        run: PLAYWRIGHT_TEST_MODULE="$GITHUB_WORKSPACE/node_modules/@playwright/test" node ops/verify-valuation-workflow.cjs
      - run: npm run test:e2e
      - run: npm run test:e2e:production
