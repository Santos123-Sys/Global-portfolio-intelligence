name: Refresh npm lockfile (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.ref == 'fix/discovery-universe-semantics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from root overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: refresh npm lockfile for source-map-js 1.2.2"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
