id: CH.IFRS.CHF
version: 1.1.0
country: CH
exchanges:
  - XSWX
  - SIX
  - SWX
accounting:
  - IFRS
  - SWISS_GAAP_FER
currency: CHF
accountingChecks:
  - Confirm IFRS versus Swiss GAAP FER
  - Pensions and leases
  - Segment and currency exposure
macroChecks:
  - CHF yield curve
  - SNB policy
  - Foreign revenue and currency exposure
taxPolicy: >-
  Source the issuer canton and combined effective/marginal tax; no country-wide
  corporate tax default.
riskFreePolicy: Use a sourced CHF default-free rate consistent with cash-flow inflation basis.
crpRequired: false
peerPolicy: >-
  Comparable SIX and global issuers, normalized accounting/periods; deduplicate
  issuer share classes.
minPeers: 4
maxPeers: 10
triggers: []
mandatory:
  - FinancialStatementAgent
  - SectorSpecialistAgent
  - ForecastingAgent
  - DCFAgent
  - PeerValuationAgent
  - RiskAgent
  - MarketMacroAgent
optional:
  - CountryRiskAgent
  - CommodityFXAgent
excluded: []
sources:
  - https://www.snb.ch/
  - https://www.six-group.com/
